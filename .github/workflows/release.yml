name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build, changelog, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          tag = os.environ["TAG"].lstrip("v")
          meta = json.loads(
              subprocess.run(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  check=True, capture_output=True, text=True,
              ).stdout
          )
          workspace_members = set(meta["workspace_members"])
          packages = {
              f"{p['name']}@{p['version']}"
              for p in meta["packages"]
              if p["id"] in workspace_members and p.get("publish") != []
          }
          bad = sorted(pkg for pkg in packages if pkg.split("@")[-1] != tag)
          if bad:
              sys.exit(f"::error::crate version(s) do not match tag {tag}: {', '.join(bad)}")
          print(f"all workspace crate versions match {tag}")
          PY

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "## Changes since $PREV_TAG" > CHANGELOG_RELEASE.md
          git log --pretty=format:"- %s (%h)" "$PREV_TAG..${GITHUB_REF_NAME}" >> CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set; cannot publish releases"
            exit 1
          fi
          cargo publish --workspace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: CHANGELOG_RELEASE.md
          generate_release_notes: false
